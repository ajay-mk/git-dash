# Area labels, applied by .github/workflows/label.yml from the files a PR changes.
# Type labels (feature, fix, docs, ...) come from the PR title prefix in the same workflow.
ui:
  - changed-files:
      - any-glob-to-any-file:
          - src/App.tsx
          - src/styles.css
          - src/assets/**
          - src/components/**
          - src/hooks/**
          - index.html

provider:
  - changed-files:
      - any-glob-to-any-file: src/providers/**

tauri:
  - changed-files:
      - any-glob-to-any-file: src-tauri/**

ci:
  - changed-files:
      - any-glob-to-any-file: .github/workflows/**

docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**
