name: Release

# Pushing a version tag (vX.Y.Z) builds installers for every platform and
# attaches them, with SHA-256 checksums and the signed update manifest
# (latest.json), to a draft GitHub Release. Publishing the draft stays a manual
# step, and is what offers the update to installed apps.
on:
  push:
    tags: ['v*']

# Least privilege: only the final job, which creates the release, can write,
# and it runs no project code. The build jobs run third-party code (npm
# packages, Cargo build scripts, the Tauri action) and hold no secrets: they
# sign update files with a throwaway key. A separate job, which runs nothing
# but the Tauri CLI, signs them again with the real key (see docs/releasing.md).
# Nothing is restored from the Actions cache, so no other workflow run can
# plant files in a release build.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      # Only reviewed code is released: the tag must point at a commit that is
      # already on main.
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the binaries link against an older
          # glibc and run on more distributions.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # tauri-action runs `npm run tauri build`, which still runs because it is
      # invoked explicitly; ignore-scripts only stops dependency install hooks.
      - run: npm ci --ignore-scripts

      # tauri.release.conf.json turns on createUpdaterArtifacts, and the
      # bundler refuses to make update files without a key. This key is made
      # here and thrown away with the runner; its signatures are never
      # published (the manifest step only accepts the real key's).
      - name: Make a throwaway update-signing key
        shell: bash
        run: |
          npm exec --no -- tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/throwaway.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Ad-hoc signature, so the app runs on Apple Silicon (which refuses
          # unsigned code). It is not trusted by Gatekeeper; see docs/installing.md.
          # To sign and notarize, replace this with the certificate's identity
          # and add (all from repository secrets):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # Do not add them while the secrets are unset: an empty
          # APPLE_CERTIFICATE still makes the bundler try to import it.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # Windows signing goes in tauri.conf.json (bundle.windows.signCommand
          # or certificateThumbprint) together with a step that installs the
          # certificate from a secret.
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      # Keep only the installers: the action also reports the raw .app bundle
      # on macOS, which is a directory and is shipped inside the .dmg anyway.
      # Signatures and the macOS update archive are handled by the next step.
      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p out
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            for (const file of JSON.parse(process.env.ARTIFACT_PATHS)) {
              if (!fs.statSync(file).isFile()) continue;
              if (file.endsWith(".sig") || file.endsWith(".app.tar.gz")) continue;
              fs.copyFileSync(file, path.join("out", path.basename(file)));
              console.log(path.basename(file));
            }
          '
          test -n "$(ls out)"

      - name: Collect update files
        shell: bash
        run: node scripts/updater.mjs collect "$TARGET" "src-tauri/target/$TARGET/release/bundle" out updater
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-${{ matrix.target }}
          path: updater/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign the update files
    needs: build
    runs-on: ubuntu-latest
    # The release key is a secret of the protected `release` environment, which
    # only v* tags can use and which waits for an approval (docs/releasing.md).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Installs the locked Tauri CLI. No dependency code runs: install
      # scripts are off, and the only package executed below is the CLI.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true

      - name: List the update files
        run: |
          node scripts/updater.mjs files updater > "$RUNNER_TEMP/update-files.txt"
          test -s "$RUNNER_TEMP/update-files.txt"

      # The only step that sees the release key, and it runs nothing but the
      # Tauri CLI. Each signature is bound to the app version, which the
      # updater checks against latest.json.
      - name: Sign with the release key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < "$RUNNER_TEMP/update-files.txt"
          for file in "${files[@]}"; do
            npm exec --no -- tauri signer sign --app-version "${TAG#v}" "out/$file"
          done

      # Points installed apps at this release's update files. The updater
      # reads it from releases/latest, so it only takes effect once the draft
      # is published. Refuses any file not signed with the app's update key.
      - name: Write the update manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir manifest
          node scripts/updater.mjs manifest "$REPO" "$TAG" updater out manifest/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: manifest/latest.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: out

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: out
        run: |
          gh release create "$TAG" ./* \
            --draft \
            --verify-tag \
            --title "GitDash $TAG" \
            --generate-notes \
            --notes "These builds are not code-signed yet. See docs/installing.md in the repository for what to expect, and verify downloads against SHA256SUMS.txt."
