name: Label PRs

# pull_request_target so PRs from forks can be labelled too. This workflow never
# checks out or runs PR code: labeler reads its config from the base branch and
# the title is only read through an environment variable.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  # issues: write lets labeler create a configured label if it is missing.
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label by files and title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # sync-labels removes area labels whose files are no longer in the diff.
      # It only touches labels named in .github/labeler.yml.
      - uses: actions/labeler@v6
        with:
          sync-labels: true

      - name: Label by Conventional Commit prefix
        uses: actions/github-script@v9
        env:
          TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const match = /^(\w+)(?:\(([^)]*)\))?!?:/.exec(process.env.TITLE ?? "");
            const [, type, scope] = match ?? [];
            const byType = {
              feat: "feature",
              fix: "fix",
              docs: "docs",
              ci: "ci",
              chore: "chore",
              test: "test",
            };
            const labels = new Set();
            if (Object.hasOwn(byType, type)) labels.add(byType[type]);
            if (scope === "deps" || scope === "deps-dev") labels.add("dependencies");

            // When the title has a prefix, drop type labels an earlier title set.
            // Titles without one (e.g. Dependabot's "Bump ...") keep their labels.
            // ci and docs are left to labeler, which syncs them with the changed files.
            const issue_number = context.payload.pull_request.number;
            const owned = ["feature", "fix", "chore", "test", "dependencies"];
            const current = context.payload.pull_request.labels.map((l) => l.name);
            for (const name of current) {
              if (match && owned.includes(name) && !labels.has(name)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name });
              }
            }
            if (labels.size > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [...labels] });
            }
